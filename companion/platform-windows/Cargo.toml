[package]
name = "chiz-platform-windows"
version = "1.0.0"
edition = "2021"

[dependencies]
chiz-core = { path = "../core" }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Security",
  "Win32_System_Threading",
  "Win32_UI_Controls",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Input_Pointer",
  "Win32_UI_WindowsAndMessaging",
] }
