[package]
name = "chiz-ui"
version = "1.0.0"
edition = "2021"

[dependencies]
chiz-core = { path = "../core" }
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "macros", "sync", "io-util"] }
serde_json = "1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tokio-rustls = "0.26"
rcgen = "0.14"
time = "0.3"
mdns-sd = "0.21"
qrcodegen = "1.8"
# JPEG only: default features drag in png/tiff/exr/webp/… for nothing.
image = { version = "0.25", default-features = false, features = ["jpeg"] }
egui = "0.32"
# No accesskit/web extras: glow renderer + bundled fonts + both Linux backends.
eframe = { version = "0.32", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
getrandom = "0.2"

[dev-dependencies]
# TLS1.2-only client for the no-fallback test (features unify with above).
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
# M6-M7 wiring (not yet compiled in): TLS identity, discovery, QR, tray, UI.
# egui = "0.29"
# tray-icon = "0.19"
# qrcode = "0.14"
# mdns-sd = "0.13"
# rustls = "0.23"
# rcgen = "0.13"
